services:
  piper:
    container_name: piper
    image: rhasspy/wyoming-piper
    command: --voice en_GB-cori-high
    volumes:
      - ./volumes/piper/data:/data
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    ports:
      - 10200:10200
  wyoming-whisper:
    container_name: wyoming-whisper
    image: ghcr.io/roryeckel/wyoming_openai:latest
    restart: unless-stopped
    environment:
      WYOMING_URI: tcp://0.0.0.0:7891
      WYOMING_LOG_LEVEL: INFO
      WYOMING_LANGUAGES: en ru
      STT_OPENAI_URL: http://host.docker.internal:8910/v1
      STT_MODELS: whisper-1           # arbitrary label; whisper-server ignores it
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux, harmless elsewhere
    ports:
      - 7891:7891
  ha-llm-tool-sanitizer:
    image: ghcr.io/nikolaykasyanov/ha-llm-tool-call-sanitizer:latest
    container_name: ha-llm-tool-sanitizer
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      UPSTREAM_BASE_URL: "http://host.docker.internal:8000"
      # Tool-call argument names to sanitize (case-insensitive).
      SANITIZE_KEYS: "name,area,floor,player_name,player_area"
      # "first" = keep text before the first comma; "off" = passthrough.
      STRIP_MODE: "first"
      LOG_LEVEL: "INFO"
    extra_hosts:
      - "host.docker.internal:host-gateway"
