services:
  piper:
    container_name: piper
    image: rhasspy/wyoming-piper
    command: --voice en_GB-cori-high
    volumes:
      - ./volumes/piper/data:/data
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    ports:
      - 10200:10200
  wyoming-whisper:
    container_name: wyoming-whisper
    image: ghcr.io/roryeckel/wyoming_openai:latest
    restart: unless-stopped
    environment:
      WYOMING_URI: tcp://0.0.0.0:7891
      WYOMING_LOG_LEVEL: INFO
      WYOMING_LANGUAGES: en ru
      STT_OPENAI_URL: http://host.docker.internal:8910/v1
      STT_MODELS: whisper-1           # arbitrary label; whisper-server ignores it
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux, harmless elsewhere
    ports:
      - 7891:7891

